name: 'Continuous Delivery'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_stress_test:
        description: 'Run the post-deploy stress test (locust, ~60s)'
        type: boolean
        default: false

env:
  PROJECT_ID: challenge-mle-498000
  REGION: us-central1
  SERVICE: delay-api

jobs:
  # Reuse the CI workflow as a gate: deploy only runs if these tests pass.
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --quiet

      - name: Capture service URL
        id: url
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Service URL: $URL"

  smoke-test:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl -fsS "${{ needs.deploy.outputs.url }}/health"

      - name: Predict check
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          status=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "$URL/predict" \
            -H "Content-Type: application/json" \
            -d '{"flights":[{"OPERA":"Aerolineas Argentinas","TIPOVUELO":"N","MES":3}]}')
          echo "HTTP $status"
          cat response.json
          echo
          test "$status" = "200"

  stress-test:
    name: Post-deploy stress test (manual)
    needs: [deploy, smoke-test]
    if: github.event_name == 'workflow_dispatch' && inputs.run_stress_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run stress test
        run: make stress-test STRESS_URL="${{ needs.deploy.outputs.url }}"

      - name: Upload stress test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-report
          path: reports/stress-test.html
          if-no-files-found: ignore
